---
# DataScienceCluster — matches the configuration present on RHDP GPU clusters.
#
# Components enabled (Managed):
#   dashboard, datasciencepipelines, kserve (Serverless), modelmeshserving, workbenches
#
# Components disabled (Removed):
#   codeflare, kueue, modelregistry, ray, trainingoperator, trustyai
#   — these are Removed on RHDP GPU sandboxes; enabling them installs heavyweight
#   dependencies not needed for this demo.
#
# kserve.serving.managementState: Managed — installs Knative Serving (requires
# Service Mesh + Serverless operators, managed by ArgoCD sync waves 2+3).
apiVersion: datasciencecluster.opendatahub.io/v1
kind: DataScienceCluster
metadata:
  name: default-dsc
  labels:
    app.kubernetes.io/created-by: rhods-operator
    app.kubernetes.io/instance: default-dsc
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: datasciencecluster
    app.kubernetes.io/part-of: rhods-operator
spec:
  components:
    codeflare:
      managementState: Removed
    dashboard:
      managementState: Managed
    datasciencepipelines:
      managementState: Managed
    feastoperator: {}
    kserve:
      managementState: Managed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headless
      serving:
        ingressGateway:
          certificate:
            type: OpenshiftDefaultIngress
        managementState: Managed
        name: knative-serving
    kueue:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Removed
    llamastackoperator: {}
    modelmeshserving:
      managementState: Managed
    modelregistry:
      managementState: Removed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Removed
    trainingoperator: {}
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
      managementState: Removed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
