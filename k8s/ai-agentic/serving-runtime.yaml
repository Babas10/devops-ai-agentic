---
# vLLM CPU ServingRuntime for Qwen2.5-1.5B-Instruct.
#
# Image: odh-vllm-cuda-rhel9 (amd64) with --device=cpu and CUDA_VISIBLE_DEVICES=""
# The odh-vllm-cpu-rhel9 image has no amd64 build (manifest list contains no
# amd64 entry — only non-x86 architectures). The CUDA image supports amd64
# and runs in CPU-only mode when CUDA_VISIBLE_DEVICES is empty.
#
# Sizing rationale (CPU-only):
#   - Model weights (bfloat16): ~3 GB
#   - KV cache + vLLM overhead:  ~4 GB
#   - Total memory limit:        12 Gi (with headroom)
#   - CPU limit: 8 cores — optimal throughput for 1.5B on CPU (~8-15 tok/s)
#
# See docs/sizing.md for the full sizing methodology.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu
  namespace: ai-agentic
spec:
  supportedModelFormats:
    - name: vLLM
      version: "1"
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      # CUDA image used — it's the only RHOAI vLLM image with an amd64 build.
      # CUDA_VISIBLE_DEVICES="" + --device=cpu forces CPU-only mode.
      image: registry.redhat.io/rhoai/odh-vllm-cuda-rhel9@sha256:9302ffc252b8681317b4d40ce8b4e66a5db3511f08f6a1ff6d34e595023f85c5
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        # vLLM downloads the model directly from HuggingFace Hub using the
        # HUGGING_FACE_HUB_TOKEN env var. KServe's storage initializer is
        # bypassed — hf:// storageUri is not supported in this KServe version
        # (only s3, hdfs, webhdfs are accepted).
        - --model=Qwen/Qwen2.5-1.5B-Instruct
        - --dtype=bfloat16        # native CPU precision — no fp16 without AVX-512
        - --device=cpu
        - --port=8080
        - --served-model-name={{.Name}}
        - --max-model-len=4096   # context window — reduce if OOM
        - --max-num-seqs=4       # concurrent sequences — keep low for CPU
      env:
        - name: CUDA_VISIBLE_DEVICES
          value: ""          # disables CUDA — forces CPU-only execution
        - name: HF_HOME
          value: /tmp/hf_home
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
      ports:
        - name: h2c
          containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 6Gi
        limits:
          cpu: "8"
          memory: 12Gi
