---
# Configuration for the LangGraph agent pod.
# All values are injected as environment variables via envFrom in the Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: ai-agentic
data:
  # Qwen KServe predictor endpoint (OpenAI-compatible, port 8080 required —
  # headless service, kube-proxy does not translate port 80→8080)
  QWEN_INFERENCE_URL: "http://qwen-predictor.ai-agentic.svc.cluster.local:8080"

  # Comma-separated list of namespaces the agent is allowed to monitor and fix.
  # System namespace prefixes (openshift-*, kube-*, etc.) are always blocked
  # regardless of this list — see monitor_cluster.py BLOCKED_PREFIXES.
  WATCHED_NAMESPACES: "ai-agentic,agent-apps"

  # Seconds to sleep between monitoring cycles
  LOOP_INTERVAL_S: "60"

  # ChromaDB persistence directory (mounted PVC)
  CHROMA_PERSIST_DIR: "/data/chroma"
