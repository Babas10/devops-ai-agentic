---
# LangGraph agent — continuous monitoring and self-healing loop.
#
# The agent runs graph.invoke({}) every LOOP_INTERVAL_S seconds:
#   monitor_cluster → classify_alert → search_rag → plan_fix
#   → execute_fix → verify → report
#
# Image: built from agent/Containerfile and pushed to quay.io.
# Update the tag here after each new build:
#   podman build -f agent/Containerfile -t quay.io/edubois/ai-agentic:<tag> .
#   podman push quay.io/edubois/ai-agentic:<tag>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: ai-agentic
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      imagePullSecrets:
        - name: edubois10-aiagent-pull-secret
      containers:
        - name: agent
          image: quay.io/edubois10/ai-agentic:1.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: HF_HOME
              value: /data/huggingface
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: agent-data
              mountPath: /data
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-data
