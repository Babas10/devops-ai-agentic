---
# LangGraph agent — continuous monitoring and self-healing loop.
# Includes the audit dashboard as a sidecar (shares agent-data PVC).
#
# The agent runs graph.invoke({}) every LOOP_INTERVAL_S seconds:
#   monitor_cluster → classify_alert → search_rag → plan_fix
#   → execute_fix → verify → report
#
# Agent image: built from agent/Containerfile and pushed to quay.io.
# Dashboard image: built from dashboard/Containerfile.
# Update the tags here after each new build:
#   podman build -f agent/Containerfile -t quay.io/edubois10/ai-agentic:<tag> .
#   podman build -f dashboard/Containerfile -t quay.io/edubois10/ai-agentic-dashboard:<tag> .
#   podman push quay.io/edubois10/ai-agentic:<tag>
#   podman push quay.io/edubois10/ai-agentic-dashboard:<tag>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: ai-agentic
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      containers:
        - name: agent
          image: quay.io/edubois10/ai-agentic:1.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: HF_HOME
              value: /data/huggingface
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-github-secret
                  key: GITHUB_TOKEN
            - name: REPO_MAPPING_FILE
              value: /etc/agent/repos.yaml
            - name: AUDIT_DB
              value: /data/audit/audit.db
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: agent-data
              mountPath: /data
            - name: repo-mapping
              mountPath: /etc/agent
              readOnly: true
        - name: dashboard
          image: quay.io/edubois10/ai-agentic-dashboard:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              protocol: TCP
          env:
            - name: AUDIT_DB
              value: /data/audit/audit.db
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: agent-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-data
        - name: repo-mapping
          configMap:
            name: agent-repo-mapping
