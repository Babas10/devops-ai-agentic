---
# KServe InferenceService — Qwen2.5-1.5B-Instruct via vLLM GPU runtime.
#
# Model storage: hf://Qwen/Qwen2.5-1.5B-Instruct
#   KServe's storage initializer downloads the model from HuggingFace Hub into
#   /mnt/models before vLLM starts. The ServingRuntime then reads from that path.
#   Requires RHOAI >= 2.16 (hf:// URI support in the storage initializer).
#   See docs/learning.md — "RHOAI Connection resources and model storage".
#
# Prerequisites:
#   - ServingRuntime 'vllm-gpu' must exist in this namespace
#   - NVIDIA L4 GPU node must be schedulable (worker-gpu role)
#
# Deployment mode: Serverless (default on this cluster — Knative Serving is Managed).
# The InferenceService gets a Knative Route and scales to 0 when idle.
# minReplicas: 1 keeps it warm to avoid cold start during the demo.
#
# RHOAI dashboard visibility:
#   - Namespace label opendatahub.io/dashboard: "true" → namespace appears as a project
#   - Namespace label modelmesh-enabled: "false" → forces KServe (not ModelMesh) mode
#   - storageUri present → dashboard can display the model source
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen
  namespace: ai-agentic
spec:
  predictor:
    minReplicas: 1
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpu
      storageUri: hf://Qwen/Qwen2.5-1.5B-Instruct
