---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: ai-agentic
  labels:
    app: dashboard
spec:
  selector:
    app: agent
  ports:
    - port: 8501
      targetPort: 8501
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard
  namespace: ai-agentic
  labels:
    app: dashboard
spec:
  to:
    kind: Service
    name: dashboard
  port:
    targetPort: 8501
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
