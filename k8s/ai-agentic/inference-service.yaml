---
# KServe InferenceService — Qwen2.5-1.5B-Instruct via vLLM CPU runtime.
#
# Prerequisites:
#   - ServingRuntime 'vllm-cpu' must exist in this namespace
#   - Secret 'hf-token' must exist in this namespace (see hf-token-sealed.yaml)
#
# Deployment mode: RawDeployment (standard K8s Deployment, no Knative).
# Rationale: CPU inference is slow — Knative scale-to-zero would cause
# multi-minute cold starts on every idle period. RawDeployment keeps the
# pod always running with minReplicas: 1.
#
# Model: vLLM downloads Qwen2.5-1.5B-Instruct directly from HuggingFace Hub
# on pod startup using HUGGING_FACE_HUB_TOKEN (~2-3 min first boot).
# No storageUri — KServe's storage initializer is bypassed because hf://
# is not a supported storage type in this KServe version (s3/hdfs/webhdfs only).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen
  namespace: ai-agentic
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-cpu
      resources:
        requests:
          cpu: "2"
          memory: 6Gi
        limits:
          cpu: "8"
          memory: 12Gi
